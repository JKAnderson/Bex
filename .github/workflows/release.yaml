on:
  push:
    tags: ['v*']

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_ID: JKAnderson.Bex

jobs:
  publish-release:
    name: Publish release to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Get version from tag
      run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME/#v}" | tee $GITHUB_ENV

    - name: Dotnet pack
      run: dotnet pack /p:PackageId=${NUGET_ID} /p:Version=${PACKAGE_VERSION} --output pack

    - name: Login to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push "pack/${NUGET_ID}.${PACKAGE_VERSION}.nupkg" --source $NUGET_SOURCE --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
